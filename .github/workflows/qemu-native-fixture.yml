name: QEMU native fixture

on:
  workflow_dispatch:
    inputs:
      device_repository:
        description: Device repository as owner/name
        required: true
        default: xVanTuring/UniXNU-qemu
      device_ref:
        description: Device repository ref
        required: true
        default: main
      defconfig:
        description: QEMU defconfig
        required: true
        default: qemu_defconfig

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  fixture:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.device_repository }}
          ref: ${{ inputs.device_ref }}
          path: device

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install host tools
        run: |
          brew install cmake ninja unifdef llvm lld mtools dtc
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"

      - name: Select QEMU device
        run: |
          ./unixnu defconfig "${{ inputs.defconfig }}" -D "$GITHUB_WORKSPACE/device"
          ./unixnu fetch xnu libplatform libdispatch AvailabilityVersions libpthread \
                          corecrypto-2023 IOStorageFamily -D "$GITHUB_WORKSPACE/device"

      - name: Build package and native fixture
        run: |
          ./unixnu build package -D "$GITHUB_WORKSPACE/device"
          python3 out/qemu/tree/scripts/build-native-user-fixture.py

      - name: Upload native fixture
        uses: actions/upload-artifact@v4
        with:
          name: unixnu-qemu-native-fixture
          path: out/qemu/tree/build/native-user-fixture/**
          if-no-files-found: error
          retention-days: 7
